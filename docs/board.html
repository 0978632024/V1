<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILDMODE 戰情看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  /* 取自 PiPi 角色模型表，維持同一家族 */
  --bg:#E7E8E3; --surface:#FCFCFA; --surface-2:#F1F2ED;
  --ink:#221A12; --muted:#6E6A60; --rule:#D2D4CC;
  --accent:#F5A02B; --accent-deep:#A85F0C;
  --st-active:#2F8F5B; --st-submit:#E76F5A; --st-recent:#B8802A; --st-idle:#8C887E;
  --pp-skin:#F5A02B; --pp-shade:#F07821;
  --pp-line:#5C3112; --pp-white:#FEEDDE; --pp-blush:#E76F5A;

  --pix:"Press Start 2P","Courier New",monospace;
  --body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --edge:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15130F; --surface:#1F1C16; --surface-2:#262219;
    --ink:#EDE8DE; --muted:#99937F; --rule:#353026;
    --accent:#F5A02B; --accent-deep:#F5C93C;
    --st-active:#6FD39B; --st-submit:#F0876F; --st-recent:#E0B268; --st-idle:#7A7568;
  }
}
:root[data-theme="dark"]{
  --bg:#15130F; --surface:#1F1C16; --surface-2:#262219;
  --ink:#EDE8DE; --muted:#99937F; --rule:#353026;
  --accent:#F5A02B; --accent-deep:#F5C93C;
  --st-active:#6FD39B; --st-submit:#F0876F; --st-recent:#E0B268; --st-idle:#7A7568;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.022) 3px 4px);
}
.pix{font-family:var(--pix);font-weight:400;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.5}

.frame{max-width:1360px;margin:0 auto;padding:clamp(.9rem,2.2vw,1.8rem);display:flex;flex-direction:column;gap:clamp(.9rem,2vw,1.4rem)}
.box{background:var(--surface);border:var(--edge) solid var(--ink);box-shadow:6px 6px 0 var(--rule)}

/* ---------- HUD ---------- */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1.2rem;padding:.85rem 1.1rem}
.brand{font-size:.72rem;color:var(--accent-deep)}
.day{font-size:.72rem;background:var(--ink);color:var(--surface);padding:.42rem .6rem}
.clock{font-size:.72rem;color:var(--muted)}
.live{margin-left:auto;display:flex;align-items:center;gap:.45rem;font-size:.6rem;color:var(--muted)}
.dot{width:9px;height:9px;background:var(--st-active);animation:blink 1.6s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.18}}

/* ---------- 五個角色 ---------- */
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:clamp(.7rem,1.6vw,1.1rem)}
.unit{background:var(--surface);border:var(--edge) solid var(--ink);box-shadow:6px 6px 0 var(--rule);
      display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;background:var(--surface-2);border-bottom:var(--edge) solid var(--ink);
       aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
       background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.035) 3px 4px)}
.stage svg{width:88%;height:88%;display:block;overflow:visible}
.pp-skin{fill:var(--pp-skin)}
.pp-shade{fill:var(--pp-shade)}
.pp-line{fill:var(--pp-line)}
.pp-white{fill:var(--pp-white)}
.pp-blush{fill:var(--pp-blush)}

.plate{position:absolute;top:0;left:0;display:flex;z-index:2}
.uid{font-family:var(--pix);font-size:.62rem;background:var(--ink);color:var(--surface);padding:.36rem .5rem}
.lv{font-family:var(--pix);font-size:.52rem;background:var(--accent);color:#221A12;padding:.36rem .45rem}

.meta{padding:.7rem .8rem;display:flex;flex-direction:column;gap:.42rem;flex:1}
.uname{font-weight:900;font-size:1.02rem;line-height:1.25}
.urole{font-size:.8rem;color:var(--muted);line-height:1.4}
.bar{display:flex;gap:3px;margin-top:.1rem}
.seg{width:100%;height:9px;background:var(--rule);border:2px solid var(--ink)}
.seg.on{background:var(--accent)}
.last{margin-top:auto;padding-top:.45rem;border-top:2px solid var(--rule);font-size:.78rem;color:var(--muted);
      display:flex;gap:.4rem;align-items:baseline}
.last time{font-family:var(--pix);font-size:.54rem;color:var(--ink);flex:none}
.last span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.status{font-family:var(--pix);font-size:.5rem;padding:.34rem .5rem;border:2px solid var(--ink);align-self:flex-start}
.unit[data-state="active"]    .status{background:var(--st-active);color:#0B1F14}
.unit[data-state="submitted"] .status{background:var(--st-submit);color:#2A0F0A}
.unit[data-state="recent"]    .status{background:var(--st-recent);color:#241703}
.unit[data-state="idle"]      .status{background:var(--surface-2);color:var(--muted)}
.unit[data-state="offline"]   .status{background:var(--surface-2);color:var(--muted)}

/* ---------- 動作：2 格 sprite 感，不用平滑補間 ---------- */
.stage svg{animation-timing-function:steps(1,end);animation-iteration-count:infinite}
.unit[data-state="active"]    .stage svg{animation-name:bob;   animation-duration:.72s}
.unit[data-state="submitted"] .stage svg{animation-name:hop;   animation-duration:.62s}
.unit[data-state="recent"]    .stage svg{animation-name:bob;   animation-duration:1.5s}
.unit[data-state="idle"]      .stage svg{animation-name:breathe;animation-duration:2.8s}
.unit[data-state="offline"]   .stage svg{animation:none;filter:grayscale(.9);opacity:.42}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-3.2%)}}
@keyframes hop{0%,38%{transform:translateY(0)}39%,64%{transform:translateY(-10%)}65%,100%{transform:translateY(0)}}
@keyframes breathe{0%,49%{transform:scale(1)}50%,100%{transform:scale(1.018)}}

.unit[data-state="submitted"] .stage{background:color-mix(in srgb,var(--st-submit) 16%,var(--surface-2))}
.unit[data-state="submitted"] .stage::before{
  content:"";position:absolute;inset:8%;border:3px solid var(--st-submit);
  animation:ring 1.1s steps(1,end) infinite}
@keyframes ring{0%,49%{opacity:.85;transform:scale(1)}50%,100%{opacity:0;transform:scale(1.1)}}

/* ---------- 下半：計數器 + 動態 ---------- */
.lower{display:grid;grid-template-columns:1fr;gap:clamp(.7rem,1.6vw,1.1rem);align-items:start}
@media (min-width:56rem){.lower{grid-template-columns:minmax(300px,.85fr) 1.15fr}}

.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:0;padding:0;align-content:start}
.cnt{padding:.85rem 1rem;border-right:var(--edge) solid var(--ink);border-bottom:var(--edge) solid var(--ink);
     display:flex;flex-direction:column;gap:.15rem;justify-content:flex-start}
.cnt:nth-child(2n){border-right:0}
.cnt:nth-last-child(-n+2){border-bottom:0}
.cnt .k{font-size:.76rem;color:var(--muted)}
.cnt .v{font-family:var(--pix);font-size:1.35rem;line-height:1.3}
.cnt.alert .v{color:var(--st-submit)}
.cnt.alert .k{color:var(--st-submit)}

.feed{padding:0;display:flex;flex-direction:column}
.feed h2{margin:0;font-family:var(--pix);font-size:.6rem;padding:.8rem 1rem;
         background:var(--ink);color:var(--surface);letter-spacing:.08em}
.feed ol{list-style:none;margin:0;padding:.35rem 0;overflow-y:auto;max-height:19rem}
.feed li{display:flex;gap:.7rem;align-items:baseline;padding:.42rem 1rem;font-size:.86rem}
.feed li+li{border-top:2px solid var(--surface-2)}
.feed time{font-family:var(--pix);font-size:.52rem;color:var(--muted);flex:none}
.feed .w{font-family:var(--pix);font-size:.52rem;background:var(--surface-2);border:2px solid var(--ink);
         padding:.2rem .34rem;flex:none;min-width:2.6rem;text-align:center}
.feed .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:1.6rem 1rem;color:var(--muted);font-size:.86rem;text-align:center}

footer{font-size:.74rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.4rem 1rem;padding:0 .2rem}
footer code{font-family:var(--pix);font-size:.54rem;background:var(--surface-2);border:2px solid var(--rule);padding:.2rem .35rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="frame">

  <div class="box hud">
    <span class="pix brand">BUILDMODE GEN-AI 2026</span>
    <span class="pix day" id="day">DAY 1</span>
    <span class="pix clock" id="clock">--:--</span>
    <span class="live pix"><i class="dot"></i><span id="gen">尚未產生資料</span></span>
  </div>

  <div class="party" id="party"></div>

  <div class="lower">
    <div class="box counters" id="counters"></div>
    <div class="box feed">
      <h2>ACTIVITY</h2>
      <ol id="feed"></ol>
    </div>
  </div>

  <footer id="foot"><span>開著就好，會自己更新。</span><span>橘色格子＝今天的動作數，滿 5 格會升級換色。</span><span>角色：PiPi（PressPlay Academy）</span></footer>

</div>

<script src="board-status.js"></script>
<script>
(function () {
  var STATE_LABEL = {
    active:'WORKING', submitted:'JUST IN', recent:'ACTIVE', idle:'IDLE', offline:'OFFLINE'
  };

  function uses(arr){
    return arr.map(function(id){ return '<use href="#w-' + id + '"/>'; }).join('');
  }

  /* 圖層順序完全照 PiPi 角色模型表：先 behind、再本體、再 front */
  function pipiSvg(g){
    g = g || {};
    var behind = [ g.head === 'sprout' ? 'sprout' : '', g.hand2 ].filter(Boolean);
    var face   = (g.face || '').split('+').filter(Boolean);
    var front  = [ g.torso, g.neck, g.head === 'sprout' ? '' : g.head ]
                   .concat(face).concat([ g.hand ]).filter(Boolean);
    return '<svg viewBox="0 0 2000 2000" role="img" aria-hidden="true">'
         + uses(behind) + '<use href="#pipi"/>' + uses(front) + '</svg>';
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderParty(people){
    var box = document.getElementById('party');
    box.innerHTML = (people || []).map(function(p){
      var n = Math.max(0, Math.min(5, p.todayCount || 0));
      var segs = '';
      for (var i = 0; i < 5; i++) segs += '<i class="seg' + (i < n ? ' on' : '') + '"></i>';
      return ''
        + '<div class="unit" data-state="' + esc(p.state) + '"'
        +      ' style="--pp-skin:' + esc(p.skin) + ';--pp-shade:' + esc(p.shade) + '">'
        +   '<div class="stage">'
        +     '<div class="plate"><span class="uid">' + esc(p.id) + '</span>'
        +       '<span class="lv">' + esc(p.levelNo) + '</span></div>'
        +     pipiSvg(p.gear)
        +   '</div>'
        +   '<div class="meta">'
        +     '<div class="uname">' + esc(p.name) + '</div>'
        +     '<div class="urole">' + esc(p.role) + '</div>'
        +     '<div class="status">' + (STATE_LABEL[p.state] || 'IDLE') + '</div>'
        +     '<div class="bar">' + segs + '</div>'
        +     '<div class="last"><time>' + esc(p.lastAt) + '</time>'
        +       '<span>' + esc(p.lastText) + '</span></div>'
        +   '</div>'
        + '</div>';
    }).join('');
  }

  function renderCounters(c, isPublic){
    c = c || {};
    var items = isPublic ? [
      // 對外版只留無害的：件數與進度，不含內部營運數字
      { k:'今日交件', v:c.submitted, alert:false },
      { k:'提案完成', v:(c.deckDone || 0) + ' / ' + (c.deckTotal || 8), alert:false }
    ] : [
      { k:'待審批',   v:c.pending,   alert:(c.pending   || 0) > 4 },
      { k:'今日交件', v:c.submitted, alert:false },
      { k:'A 級未修', v:c.gradeA,    alert:(c.gradeA    || 0) > 0 },
      { k:'提案完成', v:(c.deckDone || 0) + ' / ' + (c.deckTotal || 8), alert:false }
    ];
    document.getElementById('counters').innerHTML = items.map(function(i){
      return '<div class="cnt' + (i.alert ? ' alert' : '') + '">'
           +   '<span class="k">' + esc(i.k) + '</span>'
           +   '<span class="v">' + esc(i.v == null ? 0 : i.v) + '</span>'
           + '</div>';
    }).join('');
  }

  function renderFeed(feed){
    var ol = document.getElementById('feed');
    if (!feed || !feed.length) {
      ol.innerHTML = '<div class="empty">今天還沒有動作。</div>';
      return;
    }
    ol.innerHTML = feed.map(function(e){
      return '<li><time>' + esc(e.at) + '</time>'
           +   '<span class="w">' + esc(e.who) + '</span>'
           +   '<span class="tx">' + esc(e.text) + '</span></li>';
    }).join('');
  }

  /* 更新失敗要看得出來。這支腳本先前把 reload 的 onerror 靜靜吞掉，
     結果對外版抓錯檔名、404、連續失敗好幾小時都沒人發現。 */
  var failCount = 0;
  function markLive(ok){
    var dot = document.querySelector('.dot');
    var txt = document.getElementById('gen');
    if (ok) {
      failCount = 0;
      if (dot) dot.style.background = 'var(--st-active)';
      return;
    }
    failCount++;
    if (failCount < 2) return;                 // 一次失敗可能只是網路抖動
    if (dot) dot.style.background = 'var(--st-submit)';
    if (txt) {
      var s = window.BUILDMODE_STATUS;
      txt.textContent = '更新失敗 · 資料停在 ' + ((s && s.clock) || '--:--');
    }
  }

  function render(){
    var s = window.BUILDMODE_STATUS;
    if (!s) { showEmpty(); return; }
    document.getElementById('day').textContent   = 'DAY ' + (s.day || 1);
    document.getElementById('clock').textContent = s.clock || '--:--';
    document.getElementById('gen').textContent   = '更新於 ' + (s.clock || '--:--');
    // 對外版（docs/board.html）：藏掉活動明細，那裡面有 commit 訊息
    if (s.isPublic) {
      var fd = document.querySelector('.feed');
      if (fd) fd.style.display = 'none';
      var lw = document.querySelector('.lower');
      if (lw) lw.style.gridTemplateColumns = '1fr';
      document.title = 'BUILDMODE 戰情看板';
      var ft = document.getElementById('foot');
      if (ft) {
        // 頁尾原本印的是內部指令與目錄名，對外版換成給隊員看的
        ft.innerHTML = '<span>大家的動態每 20 秒更新一次，開著就好。</span>'
                     + '<span>橘色格子＝今天的動作數，滿 5 格會升級換色。</span>'
                     + '<span>角色：PiPi（PressPlay Academy）</span>';
      }
    }
    renderParty(s.people);
    renderCounters(s.counters, s.isPublic);
    if (!s.isPublic) renderFeed(s.feed);
  }

  /* 新機器 clone 完還沒跑過腳本，status.js 不存在（它有進 gitignore）。
     給一句能照做的話，不要留白畫面。 */
  function showEmpty(){
    var box = document.getElementById('party');
    if (!box || box.dataset.empty === '1') return;
    box.dataset.empty = '1';
    box.style.gridTemplateColumns = '1fr';
    var lw = document.querySelector('.lower');
    if (lw) lw.style.display = 'none';
    box.innerHTML =
      '<div class="box" style="padding:1.6rem 1.4rem;display:flex;flex-direction:column;gap:.7rem">'
      + '<div class="pix" style="font-size:.66rem;color:var(--accent-deep)">NO DATA</div>'
      + '<div style="font-weight:900;font-size:1.1rem">還沒有資料</div>'
      + '<div style="color:var(--muted);font-size:.92rem">'
      +   '在 repo 根目錄跑一次，然後重新載入這頁：'
      + '</div>'
      + '<div class="pix" style="font-size:.6rem;background:var(--surface-2);'
      +   'border:2px solid var(--ink);padding:.7rem .8rem;overflow-x:auto">'
      +   './dashboard/build-status.ps1'
      + '</div>'
      + '<div style="color:var(--muted);font-size:.86rem">'
      +   '想先看畫面長怎樣就加 -Demo（假資料）。'
      + '</div></div>';
  }

  /* 資料檔名從實際掛上的 script 標籤推出來 —— 內部版是 status.js、
     對外版是 board-status.js。寫死的話對外版會抓到 404，重讀永遠失敗。 */
  var DATA_SRC = (function(){
    var tags = document.querySelectorAll('script[src]');
    for (var i = 0; i < tags.length; i++) {
      var src = tags[i].getAttribute('src') || '';
      if (src.indexOf('status.js') !== -1) return src.split('?')[0];
    }
    return 'status.js';
  })();

  /* file:// 下 fetch 會被 CORS 擋，所以用重新掛 script 標籤的方式重讀 */
  function reload(){
    var t = document.createElement('script');
    t.src = DATA_SRC + '?t=' + Date.now();
    t.onload  = function(){ markLive(true);  render(); t.remove(); };
    t.onerror = function(){ markLive(false); t.remove(); };   // 不要靜靜吞掉
    document.body.appendChild(t);
  }

  // 先用 script 標籤帶進來的資料畫一次，畫面不會空白（但這份可能是快取的）
  render();

  // 立刻再抓一次帶 cache-buster 的。初次載入的 <script src> 沒有查詢字串，
  // Pages 的 Cache-Control: max-age=600 會餵瀏覽器 10 分鐘前的舊資料 ——
  // 症狀是明明推了新資料，開頁面還是看到舊的。
  reload();

  // 對外版走 GitHub Pages，CDN 快取約 10 分鐘，20 秒輪詢是白打 → 放寬到 60 秒
  var everyMs = (window.BUILDMODE_STATUS && window.BUILDMODE_STATUS.isPublic) ? 60000 : 20000;
  setInterval(reload, everyMs);
})();
</script>
